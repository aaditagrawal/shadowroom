name: Native checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  LCMS2_STATIC: '1'
  RUST_VERSION: '1.99.1'
  # rust-cache hashes installed toolchains; exclude unrelated hosted-image updates.
  RUSTUP_HOME: ${{ github.workspace }}/.local/ci-rustup
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TEST_THREADS: '2'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_run_id: ${{ steps.plan.outputs.reuse_run_id }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - name: Validate version, lockfiles and tag
        run: uv run --no-project python scripts/release-metadata.py
      - name: Release metadata, COPR safety and ABI regression tests
        run: uv run --no-project python -m unittest discover -s scripts/tests
      - name: Package script syntax
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Documentation links
        run: uv run --no-project python scripts/check-docs.py
      - name: Plan native checks and exact-commit artifact reuse
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || false }}
        run: uv run --no-project python scripts/ci-plan.py

  core:
    name: Core / ${{ matrix.os }}
    needs: preflight
    if: needs.preflight.outputs.native == 'true' && needs.preflight.outputs.reuse_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        # Scheduling concurrency is not a compiler input; retain the warm cache namespace.
        env:
          CARGO_BUILD_JOBS: '2'
        with:
          shared-key: core-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Validate version and tag
        run: uv run --no-project python scripts/release-metadata.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core behavior
        run: cargo test --locked --no-default-features
      - name: Native media backends
        run: cargo test --locked --no-default-features --features native-color,native-codecs
      - name: Experimental Rust media backends
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features --features rust-color,rust-heif
      - name: CPU/X11 prototype
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path tools/compat-desktop/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/compat-desktop/Cargo.toml

  linux:
    name: Linux x86_64 / glibc 2.28
    needs: preflight
    if: needs.preflight.outputs.native == 'true' && needs.preflight.outputs.reuse_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        # Scheduling concurrency is not a compiler input; retain the warm cache namespace.
        env:
          CARGO_BUILD_JOBS: '2'
        with:
          shared-key: release-linux-el8-${{ hashFiles('packaging/linux/Containerfile', 'vendor/**', 'scripts/normalize-xattr-mtimes.py') }}
          workspaces: '. -> .local/ci-linux/target'
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Stabilize tracked xattr source timestamps
        run: uv run --no-project python scripts/normalize-xattr-mtimes.py
      - name: Cache patched xattr dependency artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .local/ci-linux/target/release/deps/*xattr*
            .local/ci-linux/target/release/.fingerprint/xattr-*
            .local/ci-linux/target/release/build/xattr-*
          key: xattr-v1-${{ runner.os }}-${{ runner.arch }}-el8-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'vendor/**', 'packaging/linux/Containerfile', '.github/workflows/ci.yml', 'scripts/ci-linux-build.sh', 'scripts/normalize-xattr-mtimes.py') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: codecs
        with:
          path: .local/ci-linux/codecs
          key: codecs-linux-x86_64-${{ hashFiles('packaging/linux/Containerfile', 'packaging/release-inputs.json', 'scripts/build-release-codecs.sh') }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Prepare public EL8 build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packaging/linux
          file: packaging/linux/Containerfile
          tags: shadowroom-release-el8:ci
          load: true
          cache-from: type=gha,scope=shadowroom-el8
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'type=gha,mode=min,scope=shadowroom-el8' || '' }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/ci-linux-tools/debs/*.deb
          key: linux-display-ubuntu-24.04-${{ hashFiles('scripts/ci-linux-tools.sh') }}
      - name: Linux package and headless display tools
        run: scripts/ci-linux-tools.sh
      - name: Validate version and tag
        id: release
        run: uv run --no-project python scripts/release-metadata.py
      - name: Fetch verified public codec and AppImage sources
        run: uv run --no-project python scripts/fetch-release-inputs.py --output .local/release-inputs
      - name: Build native desktop and codecs on EL8
        run: scripts/ci-linux-build.sh
      - name: Package Linux and AppImage
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-linux/target
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          desktop-file-validate packaging/linux/app.shadowroom.Shadowroom.desktop
          scripts/package-linux.sh --no-build --heif-runtime .local/ci-linux/codecs --glibc-baseline 2.28
          scripts/package-appimage.sh --package "dist/shadowroom-$RELEASE_VERSION-linux-x86_64" \
            --runtime .local/release-inputs/runtime-x86_64 \
            --runtime-sha256 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d \
            --runtime-metadata .local/release-inputs \
            --output "dist/Shadowroom-$RELEASE_VERSION-x86_64.AppImage"
          uv run --no-project python scripts/release-checksums.py dist
      - name: Actual AppImage native smoke without FUSE
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GPUI_X11_SCALE_FACTOR: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
            uv run --no-project python scripts/native-appimage-smoke.py \
              --binary "dist/Shadowroom-$RELEASE_VERSION-x86_64.AppImage" \
              --output .local/ci-appimage-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadowroom-linux-x86_64
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-native-evidence
          path: |
            .local/ci-appimage-smoke/report.json
            .local/ci-appimage-smoke/failure.txt
            .local/ci-appimage-smoke/native.stderr
            .local/ci-appimage-smoke/native.stdout
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS arm64 native package
    needs: preflight
    if: needs.preflight.outputs.native == 'true' && needs.preflight.outputs.reuse_run_id == ''
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        # Scheduling concurrency is not a compiler input; retain the warm cache namespace.
        env:
          CARGO_BUILD_JOBS: '2'
        with:
          shared-key: release-macos-arm64-${{ hashFiles('vendor/**', 'scripts/normalize-xattr-mtimes.py') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Stabilize tracked xattr source timestamps
        run: uv run --no-project python scripts/normalize-xattr-mtimes.py
      - name: Cache patched xattr dependency artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/release/deps/*xattr*
            target/release/.fingerprint/xattr-*
            target/release/build/xattr-*
          key: xattr-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'vendor/**', '.github/workflows/ci.yml', 'scripts/package-macos.sh', 'scripts/normalize-xattr-mtimes.py') }}
      - name: Validate version and tag
        run: uv run --no-project python scripts/release-metadata.py
      - name: Build native desktop and remote agent
        run: cargo build --locked --release --features runtime-shaders --bins
      - name: Desktop behavior
        run: cargo test --release --locked --features runtime-shaders --bin shadowroom
      - name: Package and verify macOS
        run: |
          scripts/package-macos.sh --no-build --runtime-shaders
          dist/Shadowroom-*/Shadowroom.app/Contents/MacOS/shadowroom --help
          dist/Shadowroom-*/Shadowroom.app/Contents/MacOS/shadowroom-remote --version
          uv run --no-project python scripts/release-checksums.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadowroom-macos-arm64
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  fedora:
    name: Fedora 44 x86_64 RPM
    needs: preflight
    if: needs.preflight.outputs.native == 'true' && needs.preflight.outputs.reuse_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        # Scheduling concurrency is not a compiler input; retain the warm cache namespace.
        env:
          CARGO_BUILD_JOBS: '2'
        with:
          shared-key: release-fedora44-${{ hashFiles('packaging/rpm/Containerfile', 'packaging/rpm/shadowroom.spec.in', 'scripts/rpm-build-srpm.sh', 'scripts/ci-fedora-build.sh', 'vendor/**') }}
          workspaces: '. -> .local/ci-rpm/target'
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Prepare Fedora build dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packaging/rpm
          file: packaging/rpm/Containerfile
          tags: shadowroom-release-fedora44:ci
          load: true
          cache-from: type=gha,scope=shadowroom-fedora44
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'type=gha,mode=min,scope=shadowroom-fedora44' || '' }}
      - name: Source RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
      - name: Prepare immutable source RPM
        run: |
          uv run --no-project python scripts/release-metadata.py
          uv run --no-project python scripts/rpm-test-prepare.py
          bash scripts/rpm-build-srpm.sh --output "$PWD/.local/ci-rpm/sources"
      - name: Build and install Fedora RPM
        run: scripts/ci-fedora-build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadowroom-fedora44-x86_64
          compression-level: 0
          path: |
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  source:
    name: Public source bundle
    needs: preflight
    if: needs.preflight.outputs.native == 'true' && needs.preflight.outputs.reuse_run_id == ''
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - name: Source archive and checksum
        run: |
          uv run --no-project python scripts/release-metadata.py
          uv run --no-project python scripts/package-source.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadowroom-source
          compression-level: 0
          path: |
            dist/*-source.tar.gz
            dist/*-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  publish:
    name: Publish verified GitHub release
    needs: [preflight, core, linux, macos, fedora, source]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.event_name == 'push' &&
      (needs.preflight.outputs.reuse_run_id != '' ||
       (needs.core.result == 'success' && needs.linux.result == 'success' &&
        needs.macos.result == 'success' && needs.fedora.result == 'success' && needs.source.result == 'success'))
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: shadowroom-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Record and revalidate native build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ needs.preflight.outputs.reuse_run_id || github.run_id }}
        run: uv run --no-project python scripts/ci-plan.py --receipt dist/BUILD-PROVENANCE.json
      - name: Validate archives and publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish-github-release.sh

  copr:
    name: Publish Fedora COPR
    needs: publish
    # Native jobs are intentionally skipped when artifacts are promoted. Override
    # the implicit success() check so those transitive skips do not skip COPR.
    if: >-
      always() && !cancelled() && needs.publish.result == 'success' &&
      github.ref_type == 'tag' && startsWith(github.ref_name, 'v') &&
      github.event_name == 'push' && vars.COPR_PROJECT == 'aaditagrawal/shadowroom'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/copr.yml
    with:
      tag: ${{ github.ref_name }}
      source_run_id: ${{ github.run_id }}
    secrets:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
