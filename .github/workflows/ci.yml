name: Native checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LCMS2_STATIC: '1'

jobs:
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v7
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core behavior
        run: cargo test --locked --no-default-features
      - name: Package script syntax
        run: bash -n scripts/*.sh
      - name: Documentation links
        run: uv run --no-project python scripts/check-docs.py

  desktop:
    name: Desktop and package / ${{ matrix.os }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang libclang-dev pkg-config cmake \
            libfontconfig1-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libzstd-dev \
            libvulkan-dev libasound2-dev desktop-file-utils
      - name: macOS Metal prerequisites
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Build native desktop
        run: cargo build --locked --release --features desktop --bins
      - name: Desktop behavior
        run: cargo test --locked --features desktop --bin shadowroom
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/app.shadowroom.Shadowroom.desktop
          scripts/package-linux.sh --no-build
          dist/shadowroom-*/bin/shadowroom --help
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          scripts/package-macos.sh --no-build
          dist/Shadowroom-*/Shadowroom.app/Contents/MacOS/shadowroom --help
      - uses: actions/upload-artifact@v7
        with:
          name: shadowroom-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
