[package]
name = "shadowroom"
version = "0.1.3"
edition = "2024"
description = "A fast, keyboard-first, non-destructive photo culling workspace"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/aaditagrawal/shadowroom"
keywords = ["photography", "culling", "raw", "gpui"]
categories = ["multimedia::images", "gui"]

[features]
default = ["desktop", "native-color", "native-codecs"]
desktop = ["dep:gpui"]
# Load packaged/system LibRaw and Linux libheif for full codec coverage.
native-codecs = ["dep:libloading"]
# Optional established ICC backend for comparison and unsupported Rust profiles.
native-color = ["dep:lcms2", "jxl-oxide/lcms2"]
# Select with --no-default-features; native-color takes precedence if both are enabled.
rust-color = []
# Experimental self-contained HEIC decoder; native fallback retains full coverage.
rust-heif = ["dep:heifer"]
# macOS: use Metal's runtime compiler when only Command Line Tools are installed.
runtime-shaders = ["desktop", "gpui/runtime_shaders"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
kamadak-exif = "0.6"
directories = "6"
walkdir = "2"
blake3 = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }
lcms2 = { version = "6", optional = true }
moxcms = { version = "=0.8.1", features = ["extended_range", "options"] }
jpeg-decoder = { version = "0.3", default-features = false }
rand = "0.9"
memchr = "2"
libloading = { version = "0.8.9", optional = true }
jxl-oxide = { version = "=0.12.6", default-features = false, features = ["moxcms"] }
jxl-bitstream = "=1.1.0"
jxl-oxide-common = "=1.0.0"
jxl-coding = "=1.0.1"
tiff = "0.11.3"
# statvfs for preflight filesystem capacity.
libc = "0.2"
gpui = { version = "0.2.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
heifer = { version = "=0.2.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Use Foundation's typed ownership/out-parameter bindings for native OS Trash.
# Both versions already belong to GPUI's pinned dependency graph.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL"] }

[dev-dependencies]
# Independent fixture generation/reference, including when native-color is disabled.
lcms2 = "6"
tempfile = "3"

[[bin]]
name = "shadowroom"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# GPUI's xattr 0.2 dependency predates libc removing Linux's ENOATTR alias.
xattr = { path = "vendor/xattr" }
[[bin]]
name = "shadowroom-remote"
path = "src/bin/shadowroom-remote.rs"
